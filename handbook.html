<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handbook - Under Construction</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Animasi Kelopak Sakura -->
    <div class="sakura-container" id="sakuraContainer"></div>

    <div class="container">
        <main class="construction-wrapper">
            <div class="card construction-card">
                <div class="construction-icon">🌸</div>
                
                <!-- Badge di-resize agar lebih pas dan ringkas -->
                <span class="badge badge-content">Under Construction</span>
                
                <h1>Handbook Masih Maintenance ;w;</h1>
                <p>Halaman panduan dan penjelasan alur sistem sedang disiapkan. Silakan kembali lagi nanti!</p>
                
                <!-- Opsi kembali dalam bentuk Button -->
                <a href="index.html" class="btn-back">
                    <span class="arrow">&larr;</span> Kembali ke Portofolio
                </a>
            </div>
        </main>

        <footer>
            <p>&copy; Test</p>
        </footer>
    </div>

    <!-- Script Animasi Kelopak Sakura -->
  <script>
const sakuraContainer = document.getElementById('sakuraContainer');

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function createPetal() {
    const petal = document.createElement('div');
    petal.classList.add('petal');

    const width = random(8, 16);
    const height = width * random(1.4, 2);

    petal.style.width = width + 'px';
    petal.style.height = height + 'px';
    petal.style.opacity = random(0.3, 1);

    sakuraContainer.appendChild(petal);

    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight;

    // Titik awal
    const p0 = {
        x: random(-50, screenWidth + 50),
        y: -50
    };

    // Titik kontrol 1
    const p1 = {
        x: p0.x + random(-300, 300),
        y: screenHeight * random(0.15, 0.35)
    };

    // Titik kontrol 2
    const p2 = {
        x: p0.x + random(-400, 400),
        y: screenHeight * random(0.55, 0.75)
    };

    // Titik akhir
    const p3 = {
        x: p0.x + random(-500, 500),
        y: screenHeight + 100
    };

    const duration = random(7000, 13000);
    const rotation = random(-720, 720);

    const startTime = performance.now();

    function animate(time) {
        const elapsed = time - startTime;
        const t = Math.min(elapsed / duration, 1);

        // Cubic Bézier
        const inv = 1 - t;

        const x =
            inv * inv * inv * p0.x +
            3 * inv * inv * t * p1.x +
            3 * inv * t * t * p2.x +
            t * t * t * p3.x;

        const y =
            inv * inv * inv * p0.y +
            3 * inv * inv * t * p1.y +
            3 * inv * t * t * p2.y +
            t * t * t * p3.y;

        const currentRotation = rotation * t;

        petal.style.transform =
            `translate3d(${x}px, ${y}px, 0) rotate(${currentRotation}deg)`;

        if (t < 1) {
            requestAnimationFrame(animate);
        } else {
            petal.remove();
        }
    }

    requestAnimationFrame(animate);
}

// Spawn petal dengan interval acak
function spawnPetal() {
    createPetal();

    setTimeout(
        spawnPetal,
        random(150, 500)
    );
}

spawnPetal();
</script>
</body>
</html>
